name: ci

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go mod tidy   # go.sum is not committed in the starter
      - run: go vet ./...
      - run: go test ./...

      - name: Build image
        run: docker build -t webhook-dispatcher:${{ github.sha }} .

      # TODO(candidate): scan the image, push to a registry, deploy to your target.
