name: ci

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # TODO(candidate): once package-lock.json is committed, add `cache: npm`
          # here and switch the next step to `npm ci`.

      - run: npm install
      - run: npm test

      - name: Build image
        run: docker build -t webhook-dispatcher:${{ github.sha }} .

      # TODO(candidate): scan the image, push to a registry, deploy to your target.
