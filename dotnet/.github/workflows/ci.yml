name: ci

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet test tests/Dispatcher.Tests

      - name: Build image
        run: docker build -t webhook-dispatcher:${{ github.sha }} .

      # TODO(candidate): scan the image, push to a registry, deploy to your target.
